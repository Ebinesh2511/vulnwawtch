# From vulnwatch/:   GEMINI_API_KEY=... docker compose up -d --build     → http://127.0.0.1:8080
#   web     dashboard; only queues jobs
#   worker  runs queued jobs, 2 at a time (WORKERS)
#   redis   the job queue
# web and worker share one SQLite database on the `db` volume.
name: vulnwatch

x-app: &app
  build:
    context: ..                        # needs ../vulnfeed too
    dockerfile: vulnwatch/Dockerfile
  image: vulnwatch:local
  env_file: .env                       # settings + SMTP etc.; stays out of the image
  environment: &env
    GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell}
    DASHBOARD_URL: http://127.0.0.1:8080
    REDIS_URL: redis://redis:6379/0
    WORKERS: "2"
    DB_DIR: /app/vulnwatch/db
  volumes:
    - db:/app/vulnwatch/db               # SQLite, on a Docker volume so both containers can lock it safely
    - ./data:/app/vulnwatch/data         # clones, fix worktrees, logs
    - ./secrets:/app/vulnwatch/secrets:ro   # GitHub App private key, read-only
  depends_on:
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8080:8000"          # this machine only: the dashboard has no login yet

  worker:
    <<: *app
    command: ["python", "worker.py"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # queued jobs survive a restart
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    restart: unless-stopped

volumes:
  db:
  redis:
