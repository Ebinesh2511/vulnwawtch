# From vulnwatch/:   GEMINI_API_KEY=... docker compose up -d --build     → http://127.0.0.1:8080
name: vulnwatch
services:
  vulnwatch:
    build:
      context: ..                      # needs ../vulnfeed too
      dockerfile: vulnwatch/Dockerfile
    image: vulnwatch:local
    env_file: .env                     # settings + SMTP etc.; stays out of the image
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell}
      DASHBOARD_URL: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8000"          # this machine only: the dashboard has no login yet
    volumes:
      - ./data:/app/vulnwatch/data     # database, clones, fix worktrees survive restarts
      - ./secrets:/app/vulnwatch/secrets:ro   # GitHub App private key, read-only
    restart: unless-stopped
